<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wyszukiwarka Państw (REST Countries API)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Wyszukiwarka Państw</h1>

    <form id="search-form">
        <input type="text" id="country-input" placeholder="Wpisz nazwę państwa (np. Canada)..." required>
        <button type="submit">Szukaj</button>
    </form>

    <div id="error-message"></div>

    <table id="countries-table" style="display: none;">
        <thead>
            <tr>
                <th>Nazwa</th>
                <th>Stolica</th>
                <th>Populacja</th>
                <th>Region</th>
                <th>Podregion</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Tutaj będą wstrzykiwane wyniki -->
        </tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
